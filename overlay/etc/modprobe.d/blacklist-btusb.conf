# Unitree G1 carrier — disable the in-box btusb so the out-of-tree rtk_btusb
# claims the RTL8852BU BT interface (pid 0bda:a85b). The in-box btusb/btrtl
# stack cannot load the 8852BU patch firmware. Matches the Unitree vendor image
# (which also renames btusb.ko -> btusb_bak; the init script does that too).
blacklist btusb
